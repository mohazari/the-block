name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs can go, but every commit on main gets its own result, so a broken merge
  # is always attributable.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: API (lint · types · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  web:
    name: Web (lint · types · tests · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: npm ci
      - name: API types match the server's Pydantic models
        run: |
          npm --workspace web run gen:api
          git diff --exit-code web/src/api/schema.ts
      - run: npm --workspace web run lint
      - run: npm --workspace web run typecheck
      - run: npm --workspace web run format:check
      - run: npm --workspace web run test
      - run: npm --workspace web run build

  e2e:
    name: End-to-end (Playwright, desktop + phone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: uv --directory server sync --locked
      - run: npx --workspace web playwright install --with-deps chromium
      - run: npm --workspace web run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
